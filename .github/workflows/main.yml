on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

name: main
jobs:
  run_action:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - run: npm ci

      - run: npm run lint

      - run: npm run build
